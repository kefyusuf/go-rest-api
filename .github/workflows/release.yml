name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ${{ github.repository }}/api

jobs:
  docker:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # On a tag push the image gets the semantic version and :latest,
      # and the annotated tag message becomes the GitHub release notes.
      # A manual dispatch builds a dev-tagged image only, so it never
      # moves :latest onto an untagged commit.
      - name: derive image tags and release notes
        id: version
        run: |
          IMAGE="ghcr.io/${REGISTRY_IMAGE}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE}:${GITHUB_REF#refs/tags/v}"
              echo "${IMAGE}:latest"
              echo "EOF"
              echo "notes<<EOF"
              git tag -l --format='%(contents)' "${GITHUB_REF#refs/tags/}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${IMAGE}:dev-${GITHUB_SHA::8}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: create the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.version.outputs.notes }}
