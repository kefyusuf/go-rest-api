version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - gocheckcompilerdirectives
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - staticcheck

# Formatters live in their own section since golangci-lint v2.
formatters:
  enable:
    - gofmt

run:
  timeout: 5m
  tests: true
